<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Dragon Shop AI</title>
<style>
  body {
    font-family: -apple-system, Arial, sans-serif;
    background: #0b1120;
    color: #f1f5f9;
    margin: 0;
    padding: 40px 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  p.subtitle { color: #94a3b8; margin-top: 0; }

  .search-box {
    display: flex;
    gap: 10px;
    margin: 30px 0;
  }
  input {
    flex: 1;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #111827;
    color: white;
    font-size: 15px;
  }
  button {
    padding: 14px 24px;
    border-radius: 10px;
    border: none;
    background: #2563eb;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 15px;
  }
  button:hover { background: #1d4ed8; }

  .results {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .card {
    background: #111827;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 16px;
  }
  .card img {
    width: 100%;
    border-radius: 8px;
    margin-bottom: 10px;
  }
  .card .price {
    font-size: 20px;
    font-weight: 700;
    color: #60a5fa;
  }
  .card .meta {
    color: #94a3b8;
    font-size: 13px;
    margin: 4px 0;
  }
  .best-choice {
    border: 2px solid #22c55e;
    position: relative;
  }
  .best-choice::before {
    content: "✅ Лучший выбор";
    display: block;
    font-size: 12px;
    color: #22c55e;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .loading { color: #94a3b8; margin-top: 20px; }
</style>
</head>
<body>
<div class="container">
  <h1>🐉 Dragon Shop AI</h1>
  <p class="subtitle">Один запрос — товары со всех китайских маркетплейсов</p>

  <div class="search-box">
    <input id="searchInput" type="text" placeholder="Например: чёрные кроссовки до 30000 тенге" />
    <button onclick="search()">Найти</button>
  </div>

  <div id="loading" class="loading" style="display:none;">Ищем лучшие варианты...</div>
  <div id="results" class="results"></div>
</div>

<script>
  // Адрес backend-сервера. Пока локальный — после деплоя backend
  // замените на реальный адрес (например https://your-backend.onrender.com)
  const API_URL = "http://localhost:8000";

  async function search() {
    const query = document.getElementById("searchInput").value.trim();
    if (!query) return;

    const resultsDiv = document.getElementById("results");
    const loadingDiv = document.getElementById("loading");
    resultsDiv.innerHTML = "";
    loadingDiv.style.display = "block";

    try {
      const response = await fetch(`${API_URL}/search?query=${encodeURIComponent(query)}`);
      const products = await response.json();

      loadingDiv.style.display = "none";

      if (products.length === 0) {
        resultsDiv.innerHTML = "<p>Ничего не найдено. Попробуйте другой запрос.</p>";
        return;
      }

      products.forEach((p, index) => {
        const card = document.createElement("div");
        card.className = "card" + (index === 0 ? " best-choice" : "");
        card.innerHTML = `
          <img src="${p.image_url}" alt="${p.title}" />
          <div class="meta">${p.source} · ⭐ ${p.rating} (${p.reviews_count} отзывов)</div>
          <div>${p.title}</div>
          <div class="price">${p.price_with_delivery_kzt.toLocaleString()} ₸</div>
          <div class="meta">без доставки: ${p.price_kzt.toLocaleString()} ₸</div>
        `;
        resultsDiv.appendChild(card);
      });
    } catch (err) {
      loadingDiv.style.display = "none";
      resultsDiv.innerHTML = "<p style='color:#f87171'>Ошибка: backend не отвечает. Проверьте, запущен ли сервер.</p>";
      console.error(err);
    }
  }

  // Поиск по нажатию Enter
  document.getElementById("searchInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") search();
  });
</script>
</body>
</html>
